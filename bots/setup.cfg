[flake8]
# 120 is the hard ceiling for code. Prompt templates and band descriptors are
# long single-string literals where wrapping would change the text sent to the
# model, so E501 is relaxed to 200 and enforced strictly by review instead.
max-line-length = 200
extend-ignore =
    E203,
    W503
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist
max-complexity = 18
per-file-ignores =
    __init__.py:F401

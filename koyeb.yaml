# =============================================================================
# Koyeb deployment blueprint - https://www.koyeb.com/docs
#
# Koyeb's free tier includes one always-on instance, which suits a Telegram
# long-polling worker better than a sleeping web service.
#
# Deploy with the CLI:
#   koyeb app init konkred
#   koyeb service create gateway --app konkred --docker ... (see below)
#
# Or paste these settings into the Koyeb control panel. Every `{{ secret.X }}`
# reference must exist first:
#   koyeb secret create GEMINI_KEY_P1 --value "AIza..."
# =============================================================================

app: konkred

services:
  # ---------------------------------------------------------------------------
  # AI Gateway
  # ---------------------------------------------------------------------------
  - name: gateway
    type: web
    git:
      repository: github.com/reARbitRA/konkred-bots
      branch: main
      workdir: gateway
      builder: dockerfile
      dockerfile: Dockerfile
    instance_type: free
    regions:
      - was            # Washington DC
    scaling:
      min: 1
      max: 1
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
        port: 3000
    health_checks:
      - http:
          port: 3000
          path: /api/health
        grace_period: 20
        interval: 30
        timeout: 10
        restart_limit: 3
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: ADMIN_KEY
        secret: ADMIN_KEY
      - key: GATEWAY_API_KEY
        secret: GATEWAY_API_KEY
      - key: GEMINI_KEY_P1
        secret: GEMINI_KEY_P1
      - key: GEMINI_KEY_P2
        secret: GEMINI_KEY_P2
      - key: GEMINI_KEY_P3
        secret: GEMINI_KEY_P3
      - key: GROQ_API_KEY
        secret: GROQ_API_KEY
      - key: CEREBRAS_API_KEY
        secret: CEREBRAS_API_KEY
      - key: MISTRAL_API_KEY
        secret: MISTRAL_API_KEY
      - key: OPENROUTER_API_KEY
        secret: OPENROUTER_API_KEY
      - key: CF_ACCOUNT_ID
        secret: CF_ACCOUNT_ID
      - key: CF_API_TOKEN
        secret: CF_API_TOKEN
      - key: GITHUB_TOKEN
        secret: GH_MODELS_TOKEN
      - key: ALLOW_MOCK
        value: "true"
      - key: FUSION_ENABLED
        value: "true"

  # ---------------------------------------------------------------------------
  # Telegram bot daemon (worker - no public port)
  # ---------------------------------------------------------------------------
  - name: bots
    type: worker
    git:
      repository: github.com/reARbitRA/konkred-bots
      branch: main
      workdir: bots
      builder: dockerfile
      dockerfile: Dockerfile
    instance_type: free
    regions:
      - was
    scaling:
      min: 1
      max: 1
    env:
      - key: LOG_LEVEL
        value: INFO
      # Koyeb service discovery: <service>.<app>.koyeb internal hostname.
      - key: GATEWAY_URL
        value: http://gateway.konkred.internal:3000
      - key: GATEWAY_API_KEY
        secret: GATEWAY_API_KEY
      # Point this at any managed Redis (Upstash free tier works well):
      #   koyeb secret create REDIS_URL --value "rediss://default:...@....upstash.io:6379"
      - key: REDIS_URL
        secret: REDIS_URL
      - key: TELEGRAM_VOICE_BOT_TOKEN
        secret: TELEGRAM_VOICE_BOT_TOKEN
      - key: TELEGRAM_PDF_BOT_TOKEN
        secret: TELEGRAM_PDF_BOT_TOKEN
      - key: TELEGRAM_IELTS_BOT_TOKEN
        secret: TELEGRAM_IELTS_BOT_TOKEN
      - key: TELEGRAM_CONTENT_BOT_TOKEN
        secret: TELEGRAM_CONTENT_BOT_TOKEN
      - key: TELEGRAM_CRYPTO_BOT_TOKEN
        secret: TELEGRAM_CRYPTO_BOT_TOKEN
      - key: HISTORY_TURNS
        value: "10"
      - key: HISTORY_TTL
        value: "86400"
      - key: DROP_PENDING_UPDATES
        value: "true"

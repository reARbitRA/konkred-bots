# One Render free web service: Node gateway + Python webhook receiver share one
# container. Redis is external (for example Upstash); there is no paid worker or
# Render Key Value service in this blueprint.
services:
  - type: web
    name: konkred-bots
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # --- Unified runtime -------------------------------------------------
      - key: BOT_MODE
        value: webhook
      - key: GATEWAY_URL
        value: http://127.0.0.1:3000
      - key: GATEWAY_PORT
        value: "3000"
      - key: WEB_HOST
        value: 0.0.0.0
      # Render automatically injects RENDER_EXTERNAL_URL; the bot uses it when
      # WEBHOOK_HOST is absent.
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DROP_PENDING_UPDATES
        value: "false"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

      # --- External Redis (paste an Upstash rediss:// connection string) ---
      - key: REDIS_URL
        sync: false

      # --- Revenue gate ----------------------------------------------------
      - key: PAYMENTS_ENABLED
        value: "true"
      - key: FREE_REQUESTS
        value: "5"
      - key: STARS_PRICE
        value: "100"
      - key: PAID_ACCESS_DAYS
        value: "30"
      - key: PAYMENT_SECRET
        generateValue: true
      # Optional manual USDT fallback. Keep blank for in-Telegram digital
      # access unless platform/legal guidance confirms a compliant use case.
      - key: USDT_WALLET_ADDRESS
        sync: false
      - key: USDT_NETWORK
        value: TRC20
      - key: USDT_PRICE
        value: "2.99"
      - key: PAYMENT_ADMIN_IDS
        sync: false
      - key: PAYMENT_SUPPORT
        sync: false

      # --- Gateway security ------------------------------------------------
      - key: ADMIN_KEY
        generateValue: true
      - key: GATEWAY_API_KEY
        generateValue: true
      - key: USERS_JSON
        sync: false

      # --- Telegram tokens (set only the bots you want) --------------------
      - key: TELEGRAM_VOICE_BOT_TOKEN
        sync: false
      - key: TELEGRAM_PDF_BOT_TOKEN
        sync: false
      - key: TELEGRAM_IELTS_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CONTENT_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CRYPTO_BOT_TOKEN
        sync: false

      # --- Free AI provider credentials (all optional) ---------------------
      - key: GEMINI_KEY_P1
        sync: false
      - key: GEMINI_KEY_P2
        sync: false
      - key: GEMINI_KEY_P3
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false

      # --- Gateway behaviour ----------------------------------------------
      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_TTL_SECONDS
        value: "600"
      # Keep headroom inside Render Free's 512 MB RAM while Node and Python
      # share the same instance.
      - key: CACHE_MAX_ENTRIES
        value: "150"
      - key: MAX_FILE_MB
        value: "15"
      - key: DEDUP_ENABLED
        value: "true"
      - key: ALLOW_MOCK
        value: "true"
      - key: FUSION_ENABLED
        value: "true"
      - key: WATCHDOG_CALIBRATION
        value: "true"
      - key: HISTORY_TURNS
        value: "10"
      - key: HISTORY_TTL
        value: "86400"

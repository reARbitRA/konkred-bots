<rect x="40" y="30" width="4" height="34" rx="2" ry="2" fill="#22D3EE" stroke="none" stroke-width="1" opacity="1.0"/><text x="60" y="46" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#22D3EE" text-anchor="start" letter-spacing="2.4">DOCKER</text><text x="60" y="66" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#E6EAF2" text-anchor="start">Three services locally, one image when hosted</text><text x="60" y="90" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8A94A6" text-anchor="start">docker-compose.yml for development; the root Dockerfile fuses both runtimes for a single free web service.</text><line x1="40" y1="112" x2="1240" y2="112" stroke="#232C3C" stroke-width="1" stroke-linecap="round" opacity="0.9"/><text x="50" y="172" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#22D3EE" text-anchor="start" letter-spacing="1.4">docker-compose.yml · network internal-net (bridge)</text><rect x="50" y="186" width="376" height="190" rx="14" ry="14" fill="url(#panelGrad)" stroke="#232C3C" stroke-width="1" opacity="1.0"/><rect x="50" y="186" width="376" height="3" rx="2" ry="2" fill="#22D3EE" stroke="none" stroke-width="1" opacity="1.0"/><text x="72" y="216" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="15" font-weight="700" fill="#22D3EE" text-anchor="start">redis</text><text x="404" y="216" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="9.6" font-weight="400" fill="#5C6678" text-anchor="end">redis:7-alpine</text><circle cx="78" cy="240" r="2.4" fill="#22D3EE" stroke="none" stroke-width="1" opacity="0.75"/><text x="90" y="244" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.2" font-weight="400" fill="#8A94A6" text-anchor="start">appendonly yes · appendfsync everysec</text><circle cx="78" cy="263" r="2.4" fill="#22D3EE" stroke="none" stroke-width="1" opacity="0.75"/><text x="90" y="267" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.2" font-weight="400" fill="#8A94A6" text-anchor="start">maxmemory 256mb · allkeys-lru</text><circle cx="78" cy="286" r="2.4" fill="#22D3EE" stroke="none" stroke-width="1" opacity="0.75"/><text x="90" y="290" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.2" font-weight="400" fill="#8A94A6" text-anchor="start">healthcheck: redis-cli ping / 10 s</text><circle cx="78" cy="309" r="2.4" fill="#22D3EE" stroke="none" stroke-width="1" opacity="0.75"/><text x="90" y="313" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.2" font-weight="400" fill="#8A94A6" text-anchor="start">volume redis-data:/data</text><line x1="72" y1="342" x2="404" y2="342" stroke="#232C3C" stroke-width="1" stroke-linecap="round" opacity="1.0"/><text x="72" y="362" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10" font-weight="400" fill="#5C6678" text-anchor="start">no dependencies</text><path d="M 428 281 L 442 281" fill="none" stroke="#5C6678" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#arrow)"/><rect x="446" y="186" width="376" height="190" rx="14" ry="14" fill="url(#panelGrad)" stroke="#232C3C" stroke-width="1" opacity="1.0"/><rect x="446" y="186" width="376" height="3" rx="2" ry="2" fill="#8B5CF6" stroke="none" stroke-width="1" opacity="1.0"/><text x="468" y="216" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="15" font-weight="700" fill="#8B5CF6" text-anchor="start">gateway</text><text x="800" y="216" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="9.6" font-weight="400" fill="#5C6678" text-anchor="end">konkred/gateway:1.0.0</text><circle cx="474" cy="240" r="2.4" fill="#8B5CF6" stroke="none" stroke-width="1" opacity="0.75"/><text x="486" y="244" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.2" font-weight="400" fill="#8A94A6" text-anchor="start">node:20-alpine · tini PID 1 · USER node</text><circle cx="474" cy="263" r="2.4" fill="#8B5CF6" stroke="none" stroke-width="1" opacity="0.75"/><text x="486" y="267" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.2" font-weight="400" fill="#8A94A6" text-anchor="start">build asserts zero npm dependencies</text><circle cx="474" cy="286" r="2.4" fill="#8B5CF6" stroke="none" stroke-width="1" opacity="0.75"/><text x="486" y="290" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.2" font-weight="400" fill="#8A94A6" text-anchor="start">healthcheck: fetch /api/health / 30 s</text><circle cx="474" cy="309" r="2.4" fill="#8B5CF6" stroke="none" stroke-width="1" opacity="0.75"/><text x="486" y="313" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.2" font-weight="400" fill="#8A94A6" text-anchor="start">volume gateway-state:/app/data</text><line x1="468" y1="342" x2="800" y2="342" stroke="#232C3C" stroke-width="1" stroke-linecap="round" opacity="1.0"/><text x="468" y="362" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10" font-weight="400" fill="#5C6678" text-anchor="start">depends_on redis: service_healthy</text><path d="M 824 281 L 838 281" fill="none" stroke="#5C6678" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#arrow)"/><rect x="842" y="186" width="376" height="190" rx="14" ry="14" fill="url(#panelGrad)" stroke="#232C3C" stroke-width="1" opacity="1.0"/><rect x="842" y="186" width="376" height="3" rx="2" ry="2" fill="#10B981" stroke="none" stroke-width="1" opacity="1.0"/><text x="864" y="216" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="15" font-weight="700" fill="#10B981" text-anchor="start">bot</text><text x="1196" y="216" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="9.6" font-weight="400" fill="#5C6678" text-anchor="end">konkred/bots:1.0.0</text><circle cx="870" cy="240" r="2.4" fill="#10B981" stroke="none" stroke-width="1" opacity="0.75"/><text x="882" y="244" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.2" font-weight="400" fill="#8A94A6" text-anchor="start">python:3.11-slim multi-stage wheels</text><circle cx="870" cy="263" r="2.4" fill="#10B981" stroke="none" stroke-width="1" opacity="0.75"/><text x="882" y="267" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.2" font-weight="400" fill="#8A94A6" text-anchor="start">non-root konkred user · tini PID 1</text><circle cx="870" cy="286" r="2.4" fill="#10B981" stroke="none" stroke-width="1" opacity="0.75"/><text x="882" y="290" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.2" font-weight="400" fill="#8A94A6" text-anchor="start">GATEWAY_URL=http://gateway:3000</text><circle cx="870" cy="309" r="2.4" fill="#10B981" stroke="none" stroke-width="1" opacity="0.75"/><text x="882" y="313" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.2" font-weight="400" fill="#8A94A6" text-anchor="start">stop_grace_period 30 s for polling drain</text><line x1="864" y1="342" x2="1196" y2="342" stroke="#232C3C" stroke-width="1" stroke-linecap="round" opacity="1.0"/><text x="864" y="362" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10" font-weight="400" fill="#5C6678" text-anchor="start">depends_on redis + gateway: service_healthy</text><rect x="50" y="392" width="1180" height="40" rx="11" ry="11" fill="#0D1017" stroke="#232C3C" stroke-width="1" opacity="1.0"/><text x="74" y="417" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="11" font-weight="400" fill="#8A94A6" text-anchor="start">ports 127.0.0.1:${GATEWAY_PORT:-3000}→3000 only — the gateway is never published to 0.0.0.0 by the compose file</text><text x="1206" y="417" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10" font-weight="400" fill="#5C6678" text-anchor="end">json-file logs · 10m × 3</text><text x="50" y="470" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#8B5CF6" text-anchor="start" letter-spacing="1.4">root Dockerfile · one container for a single free web service</text><rect x="50" y="484" width="1180" height="168" rx="14" ry="14" fill="url(#panelGrad)" stroke="#232C3C" stroke-width="1" opacity="1.0"/><rect x="74" y="506" width="520" height="56" rx="11" ry="11" fill="#0D1017" stroke="#8B5CF6" stroke-width="1" opacity="1.0"/><text x="94" y="530" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="11.5" font-weight="600" fill="#8B5CF6" text-anchor="start">node /app/gateway/src/server.mjs</text><text x="94" y="548" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10" font-weight="400" fill="#8A94A6" text-anchor="start">HOST=127.0.0.1 PORT=3000 — loopback only, never public</text><rect x="686" y="506" width="520" height="56" rx="11" ry="11" fill="#0D1017" stroke="#22D3EE" stroke-width="1" opacity="1.0"/><text x="706" y="530" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="11.5" font-weight="600" fill="#22D3EE" text-anchor="start">python /app/bots/main.py</text><text x="706" y="548" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10" font-weight="400" fill="#8A94A6" text-anchor="start">WEB_HOST=0.0.0.0 PORT=$PORT — /healthz + Telegram webhooks</text><path d="M 600 534 L 680 534" fill="none" stroke="#5C6678" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#arrow)"/><text x="640" y="524" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="9" font-weight="400" fill="#5C6678" text-anchor="middle">loopback</text><text x="74" y="592" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="400" fill="#8A94A6" text-anchor="start">entrypoint.sh supervises both PIDs under tini, forwards SIGTERM to each, and exits as soon as either runtime stops so the platform restarts a complete service.</text><text x="74" y="614" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="400" fill="#8A94A6" text-anchor="start">NODE_OPTIONS=--max-old-space-size=192 · wheels are built in a separate stage · the runtime image carries no compiler toolchain.</text><text x="74" y="636" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="400" fill="#F59E0B" text-anchor="start">Docker is not installed in this verification sandbox, so image builds were not executed here — the manifests were parsed and structurally validated instead.</text>
</svg>
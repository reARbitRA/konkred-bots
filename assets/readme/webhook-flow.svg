<rect x="0.5" y="0.5" width="1279" height="619" rx="18" fill="none" stroke="#232C3C" stroke-width="1"/>
<rect x="40" y="30" width="4" height="34" rx="2" ry="2" fill="#8B5CF6" stroke="none" stroke-width="1" opacity="1.0"/><text x="60" y="46" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#8B5CF6" text-anchor="start" letter-spacing="2.4">WEBHOOK BEHAVIOUR</text><text x="60" y="66" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#E6EAF2" text-anchor="start">Authenticate, acknowledge, then work</text><text x="60" y="90" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8A94A6" text-anchor="start">Telegram gets its 200 before any download or inference starts.</text><line x1="40" y1="112" x2="1240" y2="112" stroke="#232C3C" stroke-width="1" stroke-linecap="round" opacity="0.9"/><rect x="30" y="150" width="220" height="34" rx="10" ry="10" fill="url(#panelGrad)" stroke="#232C3C" stroke-width="1" opacity="1.0"/><text x="140" y="172" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#E6EAF2" text-anchor="middle">Telegram</text><line x1="140" y1="186" x2="140" y2="520" stroke="#232C3C" stroke-width="1" stroke-linecap="round" opacity="1.0" stroke-dasharray="4 6"/><rect x="360" y="150" width="220" height="34" rx="10" ry="10" fill="url(#panelGrad)" stroke="#232C3C" stroke-width="1" opacity="1.0"/><text x="470" y="172" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#E6EAF2" text-anchor="middle">aiohttp PublicServer</text><line x1="470" y1="186" x2="470" y2="520" stroke="#232C3C" stroke-width="1" stroke-linecap="round" opacity="1.0" stroke-dasharray="4 6"/><rect x="700" y="150" width="220" height="34" rx="10" ry="10" fill="url(#panelGrad)" stroke="#232C3C" stroke-width="1" opacity="1.0"/><text x="810" y="172" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#E6EAF2" text-anchor="middle">Dispatcher task</text><line x1="810" y1="186" x2="810" y2="520" stroke="#232C3C" stroke-width="1" stroke-linecap="round" opacity="1.0" stroke-dasharray="4 6"/><rect x="1020" y="150" width="220" height="34" rx="10" ry="10" fill="url(#panelGrad)" stroke="#232C3C" stroke-width="1" opacity="1.0"/><text x="1130" y="172" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#E6EAF2" text-anchor="middle">Gateway</text><line x1="1130" y1="186" x2="1130" y2="520" stroke="#232C3C" stroke-width="1" stroke-linecap="round" opacity="1.0" stroke-dasharray="4 6"/><path d="M 148 216 L 462 216" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#arrowViolet)"/><text x="305.0" y="208" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.6" font-weight="400" fill="#8A94A6" text-anchor="middle">POST /webhook/{bot_key}/{path_secret}</text><path d="M 472 242 C 510 236 510 262 476 257" fill="none" stroke="#EC4899" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#arrow)"/><text x="516" y="254" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.6" font-weight="400" fill="#8A94A6" text-anchor="start">hmac.compare_digest(path_secret) → 404 on mismatch</text><path d="M 472 278 C 510 272 510 298 476 293" fill="none" stroke="#EC4899" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#arrow)"/><text x="516" y="290" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.6" font-weight="400" fill="#8A94A6" text-anchor="start">X-Telegram-Bot-Api-Secret-Token → 403 on mismatch</text><path d="M 472 314 C 510 308 510 334 476 329" fill="none" stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#arrow)"/><text x="516" y="326" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.6" font-weight="400" fill="#8A94A6" text-anchor="start">Update.model_validate() → 400 on a bad body</text><path d="M 478 360 L 802 360" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#arrowCyan)"/><text x="640.0" y="352" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.6" font-weight="400" fill="#8A94A6" text-anchor="middle">asyncio.create_task(feed_update)</text><path d="M 462 396 L 148 396" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#arrowGreen)"/><text x="305.0" y="388" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.6" font-weight="400" fill="#E6EAF2" text-anchor="middle">200 OK — sub-millisecond ack (tests/test_webhook.py)</text><path d="M 818 440 L 1122 440" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#arrowViolet)"/><text x="970.0" y="432" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.6" font-weight="400" fill="#8A94A6" text-anchor="middle">handler → gateway_client.ask()</text><path d="M 1122 476 L 818 476" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" marker-end="url(#arrowViolet)"/><text x="970.0" y="468" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.6" font-weight="400" fill="#8A94A6" text-anchor="middle">completion or typed GatewayError</text><rect x="50" y="528" width="578" height="66" rx="13" ry="13" fill="#0D1017" stroke="#232C3C" stroke-width="1" opacity="1.0"/><text x="74" y="552" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#EC4899" text-anchor="start" letter-spacing="1.6">SECRETS</text><text x="74" y="570" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.2" font-weight="400" fill="#8A94A6" text-anchor="start">path = HMAC-SHA256(WEBHOOK_SECRET, &quot;{key}:{token}&quot;)[:32]</text><text x="74" y="586" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="9.8" font-weight="400" fill="#5C6678" text-anchor="start">a bot token never appears in a URL; Render&#x27;s base64 secret is hashed to Telegram-safe hex</text><rect x="652" y="528" width="578" height="66" rx="13" ry="13" fill="#0D1017" stroke="#232C3C" stroke-width="1" opacity="1.0"/><text x="676" y="552" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#10B981" text-anchor="start" letter-spacing="1.6">SHUTDOWN</text><text x="676" y="570" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="10.2" font-weight="400" fill="#8A94A6" text-anchor="start">in-flight tasks are awaited up to 20 s, then cancelled</text><text x="676" y="586" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" font-size="9.8" font-weight="400" fill="#5C6678" text-anchor="start">DROP_PENDING_UPDATES=false: an update that wakes a sleeping instance is not discarded</text>
</svg>